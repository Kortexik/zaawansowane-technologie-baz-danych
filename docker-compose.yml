version: "3.9"

services:
  mysql:
    image: mysql:8.3
    container_name: bench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benchmark
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/sql/mysql:/docker-entrypoint-initdb.d

  postgres:
    image: postgres:16
    container_name: bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/sql/postgres:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    container_name: bench-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bench
      MONGO_INITDB_ROOT_PASSWORD: bench
      MONGO_INITDB_DATABASE: benchmark
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: bench-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  redis_data: