version: "3.9"

services:
  mysql:
    image: mysql:8.3
    container_name: bench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benchmark
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
    command:
      - --innodb-buffer-pool-size=4G
      - --innodb-log-buffer-size=64M
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/sql/mysql:/docker-entrypoint-initdb.d

  postgres:
    image: postgres:16
    container_name: bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/sql/postgres:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    container_name: bench-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bench
      MONGO_INITDB_ROOT_PASSWORD: bench
      MONGO_INITDB_DATABASE: benchmark
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: bench-redis
    restart: unless-stopped
    # maxmemory + allkeys-lru caps Redis so 10M-scale loads can't OOM-kill
    # the container. Persistence (AOF + RDB) is disabled because AOF rewrite
    # forks the process — at 10M keys the fork's copy-on-write blow-up
    # ate >4 GB and Docker killed the container even though the steady
    # state stayed under the cap. We don't need durability for a benchmark.
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
  redis_data: